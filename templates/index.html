<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Router Diagnostics</title>
<style>
  :root {
    --blue: #0e2f4f;      /* blueprint ground */
    --blue-deep: #0a2340;
    --line: #6fa8d6;      /* drafting line */
    --line-dim: #35597c;
    --paper: #eef4f9;     /* printout */
    --ink: #10263b;
    --text: #dcebf7;
    --amber: #ffb000;
    --green: #46d39a;
    --red: #ff7a7a;
    --sans: Bahnschrift, "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--blue); color: var(--text); font-family: var(--sans); }
  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 28px 24px 48px; }

  /* animated blueprint grid: vertical lines drift sideways, data streaks run along the horizontal lines */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        background-image: linear-gradient(var(--line-dim) 1px, transparent 1px), linear-gradient(90deg, var(--line-dim) 1px, transparent 1px);
        background-size: 32px 32px; background-position: -1px -1px; animation: drift 10s linear infinite; }
  .bg i { position: absolute; left: 0; width: 56px; height: 2px; opacity: .85;
          background: linear-gradient(90deg, transparent, var(--amber)); transform: translateX(-80px);
          animation: travel linear infinite; }
  .bg i:nth-child(1) { top: calc(32px * 3 - 1px);  animation-duration: 9s;  animation-delay: -2s; }
  .bg i:nth-child(2) { top: calc(32px * 8 - 1px);  animation-duration: 13s; animation-delay: -7s; }
  .bg i:nth-child(3) { top: calc(32px * 13 - 1px); animation-duration: 11s; animation-delay: -4s; }
  .bg i:nth-child(4) { top: calc(32px * 19 - 1px); animation-duration: 15s; animation-delay: -10s; }
  .bg i:nth-child(5) { top: calc(32px * 24 - 1px); animation-duration: 10s; animation-delay: -1s; }
  @keyframes drift { to { background-position: 31px -1px; } }
  @keyframes travel { to { transform: translateX(calc(100vw + 80px)); } }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin: 4px 0 0; color: var(--line); font-size: 15px; }
  .demo { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .demo input { accent-color: var(--amber); width: 16px; height: 16px; }

  /* connection path */
  .path { display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; gap: 0;
          background: var(--blue-deep); border: 1px solid var(--line); padding: 22px 20px; }
  .node { border: 1px solid var(--line); padding: 10px 14px; min-width: 150px; background: var(--blue); }
  .node b { display: block; font-weight: 600; font-size: 15px; }
  .node small { color: var(--line); font-size: 13px; }
  .node input { width: 100%; margin-top: 6px; background: transparent; border: 0; border-bottom: 1px dashed var(--line);
                color: var(--text); font: 15px var(--mono); padding: 2px 0; }
  .node input:focus { outline: none; border-bottom-color: var(--amber); }
  .node.router { border-color: var(--amber); }
  .link { height: 2px; margin: 0 10px; background: var(--line-dim); position: relative; }
  .path[data-state="busy"] .link { background: repeating-linear-gradient(90deg, var(--amber) 0 10px, transparent 10px 18px);
                                   background-size: 18px 2px; animation: flow .7s linear infinite; }
  .path[data-state="ok"] .link { background: var(--green); }
  .path[data-state="fail"] .link:last-of-type { background: repeating-linear-gradient(90deg, var(--red) 0 6px, transparent 6px 14px); }
  .path[data-state="fail"] .link:first-of-type { background: var(--green); }
  @keyframes flow { to { background-position: 18px 0; } }
  .actions { display: flex; align-items: center; gap: 18px; margin: 18px 0 26px; flex-wrap: wrap; }
  button.run { background: var(--amber); color: #2a1c00; border: 0; padding: 13px 28px; font: 600 16px var(--sans);
               cursor: pointer; border-radius: 3px; }
  button.run:hover { filter: brightness(1.08); }
  button.run:disabled { opacity: .6; cursor: progress; }
  #status { margin: 0; font-size: 15px; min-height: 1.4em; }
  #status.ok { color: var(--green); }
  #status.fail { color: var(--red); }

  /* workspace */
  .work { display: grid; grid-template-columns: 280px 1fr; gap: 0; border: 1px solid var(--line); background: var(--blue-deep); }
  .cmds { border-right: 1px solid var(--line); }
  .cmds h2, .out-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--line); }
  .cmds h2 { padding: 14px 16px; border-bottom: 1px solid var(--line-dim); }
  .cmds button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px;
                 background: transparent; color: var(--text); border: 0; border-bottom: 1px solid var(--line-dim);
                 font: 14px var(--mono); cursor: pointer; }
  .cmds button:hover { background: var(--blue); }
  .cmds button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
  .dot.busy { border-color: var(--amber); background: var(--amber); }
  .dot.ok { border-color: var(--green); background: var(--green); }
  .dot.fail { border-color: var(--red); background: var(--red); }
  .out { min-width: 0; display: flex; flex-direction: column; }
  .out-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line-dim); min-height: 51px; }
  .copy { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 5px 14px; font: 13px var(--sans); cursor: pointer; border-radius: 3px; }
  .copy:hover { background: var(--blue); }
  .copy[hidden] { display: none; }
  pre { margin: 16px; padding: 18px; flex: 1; min-height: 320px; max-height: 520px; overflow: auto;
        background: var(--paper); color: var(--ink); font: 13px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
  pre.placeholder { color: #4d667d; font-family: var(--sans); font-size: 15px; }
  pre.error { color: #8a1c1c; }

  @media (max-width: 800px) {
    .path { grid-template-columns: 1fr; gap: 10px; }
    .link { width: 2px; height: 22px; margin: 0 0 0 24px; }
    .path[data-state="busy"] .link { background-size: 2px 18px; background-image: repeating-linear-gradient(180deg, var(--amber) 0 10px, transparent 10px 18px); }
    .work { grid-template-columns: 1fr; }
    .cmds { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { .bg { animation: none; } .bg i { display: none; } .path[data-state="busy"] .link { animation: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div>
      <h1>Router diagnostics</h1>
      <p class="sub">Cisco 3725 in the EVE-NG lab, reached over telnet</p>
    </div>
    <label class="demo"><input type="checkbox" id="demo"> Use sample data (no router needed)</label>
  </header>

  <section class="path" id="path" data-state="idle" aria-label="Connection path">
    <div class="node"><b>This PC</b><small>Flask app, 127.0.0.1</small></div>
    <div class="link"></div>
    <div class="node"><b>EVE-NG server</b><label class="sr" for="ip" hidden>Address</label>
      <input id="ip" value="{{ defaults.ip }}" autocomplete="off" aria-label="EVE-NG server address"></div>
    <div class="link"></div>
    <div class="node router"><b>Router R1</b><small>telnet console port</small>
      <input id="port" value="{{ defaults.port }}" inputmode="numeric" autocomplete="off" aria-label="Router console port"></div>
  </section>

  <div class="actions">
    <button class="run" id="run">Run diagnostics</button>
    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <section class="work">
    <div class="cmds" role="tablist" aria-label="Commands">
      <h2>Commands</h2>
      {% for c in commands %}
      <button role="tab" type="button" data-i="{{ loop.index0 }}" aria-selected="{{ 'true' if loop.first else 'false' }}"><span class="dot"></span>{{ c }}</button>
      {% endfor %}
    </div>
    <div class="out">
      <div class="out-head"><h2 id="out-title">Output</h2><button class="copy" id="copy" type="button" hidden>Copy</button></div>
      <pre id="out" class="placeholder">Nothing yet. Select Run diagnostics to send the commands to the router.</pre>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const tabs = [...document.querySelectorAll(".cmds button")];
const names = tabs.map((t) => t.textContent.trim());
const state = { results: null, error: null, selected: 0 };

function setPath(s) { $("path").dataset.state = s; }
function setStatus(text, cls) { $("status").textContent = text; $("status").className = cls || ""; }
function setDots(cls) { tabs.forEach((t) => (t.querySelector(".dot").className = "dot " + cls)); }

function render() {
  tabs.forEach((t, i) => t.setAttribute("aria-selected", String(i === state.selected)));
  $("out-title").textContent = names[state.selected];
  const out = $("out");
  if (state.error) {
    out.className = "error";
    out.textContent = state.error + "\n\nCheck that the router is started in EVE-NG, the port matches its telnet port, and no other console tab is open on it.";
    $("copy").hidden = true;
  } else if (state.results) {
    out.className = "";
    out.textContent = state.results[state.selected].output;
    $("copy").hidden = false;
  }
}

tabs.forEach((t, i) => t.addEventListener("click", () => { state.selected = i; render(); }));

$("copy").addEventListener("click", async () => {
  const btn = $("copy");
  try { await navigator.clipboard.writeText($("out").textContent); btn.textContent = "Copied"; }
  catch { btn.textContent = "Copy failed"; }
  setTimeout(() => (btn.textContent = "Copy"), 1500);
});

$("run").addEventListener("click", async () => {
  $("run").disabled = true;
  state.results = null; state.error = null;
  setPath("busy"); setDots("busy"); setStatus("Connecting to the router…");
  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ip: $("ip").value, port: $("port").value, demo: $("demo").checked }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Unknown error");
    state.results = data.results;
    setPath("ok"); setDots("ok");
    setStatus(`${data.results.length} commands completed`, "ok");
  } catch (err) {
    state.error = err.message;
    setPath("fail"); setDots("fail");
    setStatus("Could not run the commands", "fail");
  } finally {
    $("run").disabled = false;
    render();
  }
});
</script>
</body>
</html>
